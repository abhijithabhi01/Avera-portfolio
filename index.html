      "image": "https://www.avera.studio/og-image.png",

        "@type": "Person",
        "name": "Aswin Krishnan",
        "jobTitle": "Founder",
        "worksFor": { "@id": "https://www.avera.studio/#organization" }
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bengaluru",
        "addressRegion": "Karnataka",
        "addressCountry": "IN"
      },
      "areaServed": "IN",
      "email": "hello@avera.studio",
      "telephone": "+91-90000-00000",

        "https://www.linkedin.com/company/avera",
        "https://www.instagram.com/avera.studio",
        "https://twitter.com/avera_studio"
      ],
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Design & Development" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "E-commerce Development" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Search Engine Optimization (SEO)" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Digital Marketing" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Management" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Analytics & Reporting" } }
      ]
    }

    <!-- Structured data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",

    <!-- Structured data: FAQPage (mirrors on-page FAQ, powers AI answer boxes) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does Avera work with early-stage or small-budget businesses?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Avera's Launch package is scoped for early-stage businesses and pre-seed founders. We tell you honestly if a smaller starting point makes more sense before you commit." }
        },
        {
          "@type": "Question",
          "name": "Can Avera take over an existing website instead of building a new one?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Avera audits existing websites — outdated CMS, missing monitoring, broken SEO — and takes over ongoing management and improvement." }
        },
        {
          "@type": "Question",
          "name": "What happens if a website managed by Avera goes down?",
          "acceptedAnswer": { "@type": "Answer", "text": "Avera's Growth and Scale plans include uptime monitoring with alerts sent directly to the Avera team, so most issues are fixed before the client notices." }
        },
        {
          "@type": "Question",
          "name": "Does Avera build e-commerce stores?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Avera builds Shopify, WooCommerce, and custom storefronts, including payment gateway setup, product catalogue structure, and ongoing store management." }
        },
        {
          "@type": "Question",
          "name": "How fast can Avera launch a website?",
          "acceptedAnswer": { "@type": "Answer", "text": "Simple marketing websites typically launch in 1 to 2 weeks. E-commerce or custom builds take 3 to 6 weeks depending on scope, confirmed after a scoping call." }
        }
      ]
    }
    </script>

    <!-- Structured data: Person (founder) -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "jobTitle": "Founder",
      "worksFor": { "@id": "https://www.avera.studio/#organization" },
      "url": "https://www.avera.studio/"
    }
    </script>
